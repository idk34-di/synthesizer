<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VERSION 1.5</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap');

  :root {
    --bg:#0a0e14; --surface:#111820; --surface2:#1a2330; --border:#1e3040;
    --accent:#5bc8e8; --accent2:#00ff88; --accent3:#ff6b6b;
    --text:#c8dce8; --text2:#4a7090;
    --screen-bg:#000d14; --screen-text:#00d4ff; --screen-dim:#003355;
    --pad-text:#001a28;
    --font-mono:'Share Tech Mono', monospace;
    --font-ui:'Rajdhani', sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-ui);
    min-height:100vh; overflow-x:hidden; transition:background .4s, color .4s;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:1rem 1.5rem; border-bottom:1px solid var(--border); background:var(--surface);
  }
  .theme-picker{ display:flex; gap:6px; align-items:center; }
  .theme-label{ font-family:var(--font-mono); font-size:9px; color:var(--text2); letter-spacing:1px; margin-right:4px; white-space:nowrap; }
  .theme-dot{ width:18px; height:18px; border-radius:50%; cursor:pointer; border:2px solid transparent; transition:transform .15s, border-color .15s; flex-shrink:0; }
  .theme-dot:hover{ transform:scale(1.25); }
  .theme-dot.active{ border-color:var(--text); transform:scale(1.2); }

  .header-right{ display:flex; align-items:center; gap:10px; }
  .visit-counter{
    font-family:var(--font-mono); font-size:11px; color:var(--text2);
    letter-spacing:1px; white-space:nowrap;
  }
  .auth-btn{
    padding:5px 14px; border-radius:2px; border:1px solid var(--border);
    font-family:var(--font-mono); font-size:11px; letter-spacing:2px;
    cursor:pointer; background:transparent; color:var(--text2); transition:all .15s;
  }
  .auth-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .user-info{
    font-family:var(--font-mono); font-size:11px; color:var(--accent2);
    letter-spacing:1px; cursor:pointer; white-space:nowrap; max-width:140px;
    overflow:hidden; text-overflow:ellipsis;
  }
  @media (max-width:560px){ .user-info{ max-width:70px; } }

  main{ max-width:860px; margin:0 auto; padding:1.5rem 1rem; display:flex; flex-direction:column; gap:1rem; }

  .tabs{ display:flex; gap:6px; flex-wrap:wrap; }
  .tab{
    padding:5px 14px; border-radius:2px; border:1px solid var(--border);
    font-family:var(--font-mono); font-size:11px; letter-spacing:2px;
    cursor:pointer; background:transparent; color:var(--text2); transition:all .15s;
  }
  .tab:hover{ border-color:var(--accent); color:var(--accent); }
  .tab.active{ background:var(--accent); color:var(--pad-text); border-color:var(--accent); }

  .device{ background:var(--surface); border:1px solid var(--border); border-radius:4px; padding:1.25rem; }

  .screen{
    background:var(--screen-bg); border:1px solid #002233; border-radius:3px;
    padding:10px 14px; margin-bottom:1.25rem; font-family:var(--font-mono);
  }
  .screen-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:4px; }
  .screen-label{ color:var(--screen-text); font-size:11px; letter-spacing:2px; }
  .screen-lang{ color:var(--screen-text); font-size:20px; letter-spacing:1px; }
  .screen-row{ display:flex; gap:16px; flex-wrap:wrap; }
  .screen-info{ color:var(--screen-dim); font-size:10px; letter-spacing:1px; }
  .screen-info.on{ color:var(--screen-text); }

  .panels{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:1.25rem; }
  @media (max-width:720px){ .panels{ grid-template-columns:1fr; } }

  .panel{
    background:var(--screen-bg); border:1px solid #002233; border-radius:3px;
    overflow:hidden; display:flex; flex-direction:column; min-height:320px;
  }
  .panel-bar{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 10px; border-bottom:1px solid #002233;
    font-family:var(--font-mono); font-size:9px; letter-spacing:2px; color:var(--screen-dim);
  }
  textarea{
    flex:1; resize:none; border:0; background:transparent; color:var(--screen-text);
    font-family:var(--font-mono); font-size:12.5px; line-height:1.6; padding:12px;
  }
  textarea:focus{ outline:none; }
  textarea::placeholder{ color:var(--screen-dim); }

  .out-wrap{ flex:1; overflow:auto; }
  pre{ margin:0; height:100%; }
  pre code.hljs{
    background:transparent !important; padding:12px !important; display:block;
    font-family:var(--font-mono) !important; font-size:12.5px; line-height:1.6; min-height:100%;
  }

  .controls-panel{ border-top:1px solid var(--border); padding-top:1rem; margin-top:.5rem; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .icon-btn{
    width:38px; height:38px; border-radius:2px; border:1px solid var(--border);
    background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all .1s; color:var(--text);
  }
  .icon-btn svg{ width:17px; height:17px; }
  .icon-btn.copy{ border-color:var(--accent2); color:var(--accent2); }
  .icon-btn.copy:hover{ background:var(--accent2); color:var(--pad-text); }
  .icon-btn.copy.done{ background:var(--accent2); color:var(--pad-text); }
  .icon-btn.trash{ border-color:var(--accent3); color:var(--accent3); }
  .icon-btn.trash:hover{ background:var(--accent3); color:#fff; }
  .btn-hint{ font-family:var(--font-mono); font-size:9px; color:var(--text2); letter-spacing:1px; }

  footer{
    margin-top:.5rem; text-align:center; color:var(--text2);
    font-family:var(--font-mono); font-size:10px; letter-spacing:1px; padding-bottom:1.5rem;
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(60px);
    background:var(--accent2); color:var(--pad-text); font-family:var(--font-mono);
    font-size:11px; letter-spacing:1px; padding:10px 20px; border-radius:3px; z-index:9999;
    transition:transform .3s; white-space:nowrap;
  }
  .toast.show{ transform:translateX(-50%) translateY(0); }
  .toast.error{ background:var(--accent3); color:#fff; }

  .codes-section{
    background:var(--surface); border:1px solid var(--border);
    border-radius:4px; padding:1rem 1.25rem;
  }
  .codes-title{ font-family:var(--font-mono); font-size:11px; color:var(--accent); letter-spacing:2px; margin-bottom:.75rem; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .codes-hint{ font-family:var(--font-mono); font-size:9px; color:var(--text2); letter-spacing:0; text-transform:none; }
  .codes-row{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:.75rem; }
  .code-name-input{
    background:var(--surface2); border:1px solid var(--border);
    color:var(--text); font-family:var(--font-mono); font-size:11px;
    padding:6px 10px; border-radius:2px; flex:1; min-width:140px;
  }
  .code-name-input::placeholder{ color:var(--text2); }
  .codes-list{ display:flex; flex-direction:column; gap:6px; }
  .code-item{
    display:flex; align-items:center; gap:8px;
    background:var(--surface2); border:1px solid var(--border);
    border-radius:3px; padding:8px 12px; flex-wrap:wrap;
  }
  .code-item-name{ font-family:var(--font-mono); font-size:11px; color:var(--text); flex:1; min-width:100px; }
  .code-item-meta{ font-family:var(--font-mono); font-size:10px; color:var(--text2); white-space:nowrap; }
  .btn-sm{
    padding:4px 10px; border-radius:2px; border:1px solid var(--border);
    background:transparent; color:var(--text2); font-family:var(--font-mono);
    font-size:10px; cursor:pointer; transition:all .1s; white-space:nowrap;
  }
  .btn-sm:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-sm.danger:hover{ border-color:var(--accent3); color:var(--accent3); }
  .btn-sm.load:hover{ border-color:var(--accent2); color:var(--accent2); }
  .sync-badge{
    font-family:var(--font-mono); font-size:9px; letter-spacing:1px;
    color:var(--text2); white-space:nowrap;
  }
  .sync-badge.on{ color:var(--accent2); }
  .btn{
    padding:7px 16px; border-radius:2px; border:1px solid var(--border);
    background:transparent; color:var(--text); font-family:var(--font-mono);
    font-size:11px; cursor:pointer; letter-spacing:1px; transition:all .1s;
  }
  .btn:hover{ border-color:var(--accent); color:var(--accent); }
  .btn.save-btn{ border-color:var(--accent2); color:var(--accent2); }
  .btn.save-btn:hover{ background:var(--accent2); color:#001a10; }

  @media (max-width:500px){ .theme-label{ display:none; } }
</style>

<body>

<div class="toast" id="toast"></div>

<header>
  <div class="theme-picker">
    <span class="theme-label">THEME</span>
    <div id="theme-dots" style="display:flex;gap:6px;align-items:center"></div>
  </div>
  <div class="header-right">
    <span class="visit-counter" id="contatore">👁 …</span>
    <button id="login-btn" class="auth-btn" onclick="accedi()">ACCEDI</button>
    <span id="user-info" class="user-info" style="display:none;" onclick="esci()"></span>
  </div>
</header>

<main>
  <div class="tabs" id="langTabs"></div>

  <div class="device">
    <div class="screen">
      <div class="screen-top">
        <span class="screen-label">CODE VIEWER</span>
        <span class="screen-lang" id="screenLang">AUTO</span>
      </div>
      <div class="screen-row">
        <span class="screen-info" id="infoLines">RIGHE 0</span>
        <span class="screen-info" id="infoChars">CAR 0</span>
      </div>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="panel-bar"><span>INPUT</span></div>
        <textarea id="input" spellcheck="false" placeholder="Incolla qui il tuo codice..."></textarea>
      </div>
      <div class="panel">
        <div class="panel-bar"><span>OUTPUT</span></div>
        <div class="out-wrap"><pre><code id="output" class="hljs"></code></pre></div>
      </div>
    </div>

    <div class="controls-panel">
      <div class="btn-row">
        <button class="icon-btn copy" id="copyBtn" type="button" title="Copia" aria-label="Copia">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="13" height="13" rx="1.5"></rect>
            <rect x="9" y="9" width="13" height="13" rx="1.5"></rect>
          </svg>
        </button>
        <button class="icon-btn trash" id="trashBtn" type="button" title="Svuota" aria-label="Svuota">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 7h16"></path>
            <path d="M9 7V4.5c0-.55.45-1 1-1h4c.55 0 1 .45 1 1V7"></path>
            <path d="M6 7l1 13.5c.04.8.7 1.5 1.5 1.5h7c.8 0 1.46-.7 1.5-1.5L18 7"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
          </svg>
        </button>
        <span class="btn-hint">copia / svuota</span>
      </div>
    </div>
  </div>

  <div class="codes-section">
    <div class="codes-title">
      <span>&lt;/&gt; SAVED CODES</span>
      <span class="sync-badge" id="syncBadge">LOCALE</span>
    </div>
    <div class="codes-row">
      <input class="code-name-input" id="code-name-input" placeholder="Nome snippet..." maxlength="40">
      <button class="btn save-btn" id="saveCodeBtn" onclick="saveCode()">↓ SALVA</button>
    </div>
    <div class="codes-list" id="codes-list"></div>
  </div>

</main>

let activeTheme = 0;
function applyTheme(idx){
  activeTheme = idx;

  for (const [k,v] of Object.entries(t.vars)) document.documentElement.style.setProperty(k,v);
  document.querySelectorAll('.theme-dot').forEach((d,i)=>d.classList.toggle('active', i===idx));
  localStorage.setItem('codeViewerUiTheme', idx);
}
function buildThemePicker(){
  document.getElementById('theme-dots').innerHTML = THEMES.map((t,i)=>
    `<div class="theme-dot${i===activeTheme?' active':''}" style="background:${t.dot}" title="${t.name}" onclick="applyTheme(${i})"></div>`
  ).join('');
}
const savedUiTheme = parseInt(localStorage.getItem('codeViewerUiTheme') || '0');
buildThemePicker();
applyTheme(savedUiTheme);

let currentLang = 'auto';

function buildLangTabs(){
  document.getElementById('langTabs').innerHTML = LANGS.map(l=>
    `<button type="button" class="tab${l.id===currentLang?' active':''}" data-lang="${l.id}">${l.label}</button>`
  ).join('');

// ═══════════════ RENDER ═══════════════
const input = document.getElementById('input');
const output = document.getElementById('output');
const screenLang = document.getElementById('screenLang');
const infoLines = document.getElementById('infoLines');
const infoChars = document.getElementById('infoChars');

function render(){
  const code = input.value;
  const hasCode = code.trim().length > 0;
  infoLines.classList.toggle('on', hasCode);
  infoChars.classList.toggle('on', hasCode);
  infoLines.textContent = 'RIGHE ' + (hasCode ? code.split('\n').length : 0);
  infoChars.textContent = 'CAR ' + code.length;

  if(!hasCode){
    output.textContent = '';
    output.className = 'hljs';
    screenLang.textContent = LANGS.find(l=>l.id===currentLang).label;
    return;
  }

  let result;
  try{
    if(currentLang === 'auto'){
      result = hljs.highlightAuto(code);
    } else {
      result = hljs.highlight(code, { language: currentLang, ignoreIllegals: true });
    }
  }catch(e){
    result = hljs.highlightAuto(code);
  }

  output.innerHTML = result.value;
  output.className = 'hljs language-' + (result.language || currentLang);
  screenLang.textContent = currentLang === 'auto'
    ? 'AUTO \u2192 ' + (result.language || '?').toUpperCase()
    : LANGS.find(l=>l.id===currentLang).label;
}
input.addEventListener('input', render);
render();

// ═══════════════ COPIA PULITA (senza sfondo nero, senza tag html visibili) ═══════════════
function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function walkColored(node){
  if(node.nodeType === Node.TEXT_NODE){
    return escapeHtml(node.textContent);
  }
  if(node.nodeType === Node.ELEMENT_NODE){
    const color = getComputedStyle(node).color;
    const inner = Array.from(node.childNodes).map(walkColored).join('');
    return '<span style="color:' + color + ';background:transparent;">' + inner + '</span>';
  }
  return '';
}
function buildCleanFragment(sourceEl){
  const inner = Array.from(sourceEl.childNodes).map(walkColored).join('');
  const baseColor = getComputedStyle(sourceEl).color;
  return '<pre style="margin:0;background:transparent;font-family:ui-monospace,Consolas,monospace;font-size:13px;white-space:pre-wrap;color:' + baseColor + ';">' + inner + '</pre>';
}

output.addEventListener('copy', (e)=>{
  const html = buildCleanFragment(output);
  e.clipboardData.setData('text/plain', input.value);
  e.clipboardData.setData('text/html', html);
  e.preventDefault();
});

function selectAllOutput(){
  const range = document.createRange();
  range.selectNodeContents(output);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function showToast(msg, isError){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ el.className = 'toast'; }, 1800);
}

async function copyOutput(){
  if(!input.value.trim()) return;

  if(navigator.clipboard && window.ClipboardItem){
    try{
      const html = buildCleanFragment(output);
      const item = new ClipboardItem({
        'text/plain': new Blob([input.value], {type:'text/plain'}),
        'text/html': new Blob([html], {type:'text/html'})
      });
      await navigator.clipboard.write([item]);
      return true;
    }catch(e){ }
  }

  try{
    selectAllOutput();
    const ok = document.execCommand('copy');
    window.getSelection().removeAllRanges();
    if(ok) return true;
  }catch(e){ }

  try{
    await navigator.clipboard.writeText(input.value);
    return true;
  }catch(e){ }

  try{
    const ta = document.createElement('textarea');
    ta.value = input.value;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){
    return false;
  }
}

document.getElementById('copyBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('copyBtn');
  const ok = await copyOutput();
  if(ok){
    btn.classList.add('done');
    showToast('Copiato \u2713');
    setTimeout(()=>btn.classList.remove('done'), 1200);
  } else {
    showToast('Copia bloccata dal browser \u2014 seleziona e usa Ctrl+C', true);
    selectAllOutput();
  }
});

// ═══════════════ SAVED CODES (locale + sync Google via Firestore) ═══════════════
let savedCodes = [];
let codesRemotiCaricati = false;
let codesSalvataggioTimer = null;

function loadCodesFromLocal(){
  try{
    const r = localStorage.getItem('codexSavedCodes');
    savedCodes = r ? JSON.parse(r) : [];
  }catch(e){ savedCodes = []; }
}
function saveCodesToLocal(){
  try{ localStorage.setItem('codexSavedCodes', JSON.stringify(savedCodes)); }
  catch(e){ showToast('Storage pieno!', true); }
}

function saveCode(){
  const nameInput = document.getElementById('code-name-input');
  const code = input.value;
  if(!code.trim()){ showToast('Niente da salvare', true); return; }
  const name = nameInput.value.trim() || ('snippet-' + new Date().toISOString().slice(0,10));
  savedCodes.push({
    id: Date.now() + '-' + Math.floor(Math.random()*1000),
    name,
    code,
    lang: currentLang,
    savedAt: new Date().toISOString()
  });
  nameInput.value = '';
  persistCodes();
  renderCodes();
  showToast('✓ ' + name + ' salvato');
}

function loadCode(id){
  const c = savedCodes.find(x => x.id === id);
  if(!c) return;
  input.value = c.code;
  currentLang = c.lang && LANGS.find(l => l.id === c.lang) ? c.lang : 'auto';
  document.querySelectorAll('#langTabs .tab').forEach(b => b.classList.toggle('active', b.dataset.lang === currentLang));
  render();
  showToast('↑ ' + c.name + ' caricato');
}

function deleteCode(id){
  const c = savedCodes.find(x => x.id === id);
  savedCodes = savedCodes.filter(x => x.id !== id);
  persistCodes();
  renderCodes();
  if(c) showToast('Eliminato: ' + c.name);
}

function renderCodes(){
  const list = document.getElementById('codes-list');
  if(!savedCodes.length){
    list.innerHTML = '<div style="font-family:var(--font-mono);font-size:10px;color:var(--text2);padding:.5rem 0">Nessuno snippet salvato. Premi ↓ SALVA per salvare il codice corrente.</div>';
    return;
  }
  list.innerHTML = savedCodes.slice().reverse().map(c => {
    const date = new Date(c.savedAt).toLocaleDateString('it-IT', {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    const langLabel = (LANGS.find(l => l.id === c.lang) || {label:'AUTO'}).label;
    return `<div class="code-item"><div class="code-item-name">&lt;/&gt; ${c.name}</div><div class="code-item-meta">${langLabel} · ${date}</div><button class="btn-sm load" onclick="loadCode('${c.id}')">▶ CARICA</button><button class="btn-sm danger" onclick="deleteCode('${c.id}')">✕</button></div>`;
  }).join('');
}

/* Salva in locale sempre, e su Firestore se l'utente ha eseguito l'accesso (debounce) */
function persistCodes(){
  saveCodesToLocal();
  const user = (typeof auth !== 'undefined') ? auth.currentUser : null;
  if(!user || !codesRemotiCaricati) return;
  clearTimeout(codesSalvataggioTimer);
  codesSalvataggioTimer = setTimeout(() => {
    db.collection("utenti").doc(user.uid).set({ savedCodes }, { merge: true })
      .catch(e => console.error("Errore salvataggio codici:", e));
  }, 800);
}

async function caricaCodiciUtente(uid){
  try{
    const doc = await db.collection("utenti").doc(uid).get();
    if(doc.exists && Array.isArray(doc.data().savedCodes)){
      savedCodes = doc.data().savedCodes;
      saveCodesToLocal();
    } else {
      codesRemotiCaricati = true;
      await db.collection("utenti").doc(uid).set({ savedCodes }, { merge: true });
    }
    codesRemotiCaricati = true;
    renderCodes();
    const badge = document.getElementById('syncBadge');
    if(badge){ badge.textContent = 'SYNC ✓'; badge.classList.add('on'); }
  }catch(e){
    console.error("Errore caricamento codici:", e);
    showToast('SYNC FALLITA', true);
  }
}

loadCodesFromLocal();
renderCodes();

document.getElementById('trashBtn').addEventListener('click', ()=>{
  input.value = '';
  render();
  input.focus();
});
</script>

async function incrementaContatore() {
  try {
    const ref = db.collection("stats").doc("visite_codex");
    await db.runTransaction(async (t) => {
      const doc = await t.get(ref);
      const attuale = doc.exists ? doc.data().count : 0;
      t.set(ref, { count: attuale + 1 });
    });
